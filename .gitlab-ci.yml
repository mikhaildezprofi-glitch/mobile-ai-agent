stages:
  - validate
  - build
  - monitor
  - agent

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"

validate-agent-queue:
  stage: validate
  image: python:3.12-slim
  script:
    - python -m py_compile agent-control/validate_queue.py agent-control/prepare_task.py agent-control/worker.py agent-control/monitor.py
    - python agent-control/validate_queue.py agent-control/queue.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: always

android-debug-apk:
  stage: build
  image: gradle:8.14.3-jdk17
  timeout: 45m
  interruptible: true
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends wget unzip git python3
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O /tmp/android-tools.zip
    - unzip -q /tmp/android-tools.zip -d /tmp/android-tools
    - mv /tmp/android-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || { sdk_status=${PIPESTATUS[1]}; test "$sdk_status" -eq 0; }
    - sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"
    - git clone https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
    - git -C third_party/llama.cpp checkout 3de52ac38818978d6da8f386eda43a856e53714a
    - sed -i 's/listOf("arm64-v8a", "x86_64")/listOf("arm64-v8a")/' third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts
  script:
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - python3 scripts/patch-llama-diagnostics.py
    - gradle --no-daemon --stacktrace :app:assembleDebug
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - app/build/outputs/apk/debug/*.apk
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

project-hourly-monitor:
  stage: monitor
  image: python:3.12-slim
  script:
    - python agent-control/validate_queue.py agent-control/queue.json
    - python agent-control/monitor.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - agent-control/monitor-report.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

gitlab-ai-agent:
  stage: agent
  image: python:3.12-slim
  timeout: 30m
  resource_group: mobile-ai-agent-serial
  script:
    - python agent-control/worker.py
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $GEMINI_API_KEY && $GITLAB_AGENT_TOKEN'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $GEMINI_API_KEY && $GITLAB_AGENT_TOKEN'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "web" && $GEMINI_API_KEY && $GITLAB_AGENT_TOKEN'
      when: manual
    - when: never
  allow_failure: false
