stages:
  - build

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
    - when: never

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

github-apk-sync:
  stage: build
  image: python:3.12-slim
  timeout: 40m
  interruptible: true
  script:
    - python3 scripts/sync-github-release.py --commit "$CI_COMMIT_SHA" --timeout 2100
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/github/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
