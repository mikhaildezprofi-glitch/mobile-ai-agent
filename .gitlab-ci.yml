stages:
  - validate
  - dispatch
  - build
  - monitor
  - agent

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "api"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  ANDROID_SDK_ROOT: "$CI_PROJECT_DIR/.android-sdk"
  ANDROID_HOME: "$CI_PROJECT_DIR/.android-sdk"
  AGENT_CONTROL_BRANCH: "sync/github-app-source-20261111"

validate-agent-queue:
  stage: validate
  image: python:3.12-slim
  script:
    - python -m py_compile agent-control/validate_queue.py agent-control/prepare_task.py agent-control/worker.py agent-control/monitor.py agent-control/dispatch_queue.py
    - python agent-control/validate_queue.py agent-control/queue.json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: always

queue-dispatch:
  stage: dispatch
  image: python:3.12-slim
  script:
    - python agent-control/dispatch_queue.py
  artifacts:
    when: always
    expire_in: 1 hour
    paths:
      - agent-control/queue.json
  rules:
    - if: '$CI_COMMIT_BRANCH == "sync/github-app-source-20261111" && $CI_PIPELINE_SOURCE == "schedule" && $GITLAB_AGENT_TOKEN'
    - if: '$CI_COMMIT_BRANCH == "sync/github-app-source-20261111" && $CI_PIPELINE_SOURCE == "api" && $GITLAB_AGENT_TOKEN'
    - if: '$CI_COMMIT_BRANCH == "sync/github-app-source-20261111" && $CI_PIPELINE_SOURCE == "push" && $GITLAB_AGENT_TOKEN'
    - when: never
  allow_failure: false

github-apk-sync:
  stage: build
  image: python:3.12-slim
  timeout: 40m
  interruptible: true
  script:
    - python3 scripts/sync-github-release.py --commit "$CI_COMMIT_SHA" --timeout 2100
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - artifacts/github/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

project-hourly-monitor:
  stage: monitor
  image: python:3.12-slim
  needs:
    - job: queue-dispatch
      artifacts: true
      optional: true
  script:
    - python agent-control/validate_queue.py agent-control/queue.json
    - python agent-control/monitor.py
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - agent-control/monitor-report.md
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

gitlab-ai-agent:
  stage: agent
  image: python:3.12-slim
  timeout: 30m
  resource_group: mobile-ai-agent-serial
  needs:
    - job: queue-dispatch
      artifacts: true
      optional: true
  script:
    - python agent-control/worker.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "sync/github-app-source-20261111" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "push") && $GEMINI_API_KEY && $GITLAB_AGENT_TOKEN'
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "sync/github-app-source-20261111" && $CI_PIPELINE_SOURCE == "web" && $GEMINI_API_KEY && $GITLAB_AGENT_TOKEN'
      when: manual
    - when: never
  allow_failure: false
