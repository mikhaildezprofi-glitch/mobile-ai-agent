name: Android APK Build

on:
  push:
    branches:
      - main
      - snapshot/device-worktree-20261109
    paths:
      - '.github/workflows/android-build.yml'
      - 'app/**'
      - 'gradle.properties'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'patches/llama.cpp/android-engine.patch'
      - 'patches/llama.cpp/VisionInferenceEngine.kt'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/android-build.yml'
      - 'app/**'
      - 'gradle.properties'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'patches/llama.cpp/android-engine.patch'
      - 'patches/llama.cpp/VisionInferenceEngine.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MOBILE AI AGENT
        uses: actions/checkout@v4

      - name: Checkout llama.cpp Android engine
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 3de52ac38818978d6da8f386eda43a856e53714a
          path: third_party/llama.cpp
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "ndk;29.0.13113456" "cmake;3.31.6"
          sed -i 's/listOf("arm64-v8a", "x86_64")/listOf("arm64-v8a")/' third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts

      - name: Apply device-tested Android native engine patch
        run: |
          PATCH_FILE="$GITHUB_WORKSPACE/patches/llama.cpp/android-engine.patch"
          git -C third_party/llama.cpp apply --check "$PATCH_FILE"
          git -C third_party/llama.cpp apply "$PATCH_FILE"
          install -D patches/llama.cpp/VisionInferenceEngine.kt third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/VisionInferenceEngine.kt
          git -C third_party/llama.cpp diff --check

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ai-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90
