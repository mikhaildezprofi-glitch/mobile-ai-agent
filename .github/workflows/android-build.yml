name: Android APK Build

on:
  push:
    branches:
      - main
      - snapshot/device-worktree-20261109
      - cloud/quality-gates-20261109
    tags:
      - 'v*'
    paths:
      - '.github/workflows/android-build.yml'
      - 'app/**'
      - 'gradle.properties'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'patches/llama.cpp/android-engine.patch'
      - 'patches/llama.cpp/VisionInferenceEngine.kt'
  pull_request:
    branches:
      - main
      - snapshot/device-worktree-20261109
    paths:
      - '.github/workflows/android-build.yml'
      - 'app/**'
      - 'gradle.properties'
      - 'build.gradle*'
      - 'settings.gradle*'
      - 'gradle/**'
      - 'patches/llama.cpp/android-engine.patch'
      - 'patches/llama.cpp/VisionInferenceEngine.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-ai-android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout MOBILE AI AGENT
        uses: actions/checkout@v4

      - name: Checkout llama.cpp Android engine
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 3de52ac38818978d6da8f386eda43a856e53714a
          path: third_party/llama.cpp
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "ndk;29.0.13113456" "cmake;3.31.6"
          sed -i 's/listOf("arm64-v8a", "x86_64")/listOf("arm64-v8a")/' third_party/llama.cpp/examples/llama.android/lib/build.gradle.kts

      - name: Apply device-tested Android native engine patch
        run: |
          PATCH_FILE="$GITHUB_WORKSPACE/patches/llama.cpp/android-engine.patch"
          git -C third_party/llama.cpp apply --check "$PATCH_FILE"
          git -C third_party/llama.cpp apply "$PATCH_FILE"
          install -D patches/llama.cpp/VisionInferenceEngine.kt third_party/llama.cpp/examples/llama.android/lib/src/main/java/com/arm/aichat/VisionInferenceEngine.kt
          git -C third_party/llama.cpp diff --check

      - name: Run lint, unit tests and build debug APK in sequence
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:lintDebug
          gradle --no-daemon --stacktrace :app:testDebugUnitTest
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Generate APK checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ai-agent-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/*.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Upload Android verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ai-agent-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish verified APK release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK artifact from successful build
        uses: actions/download-artifact@v4
        with:
          name: mobile-ai-agent-debug-apk
          path: release-assets

      - name: Publish tagged APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: MOBILE AI AGENT ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.apk.sha256
