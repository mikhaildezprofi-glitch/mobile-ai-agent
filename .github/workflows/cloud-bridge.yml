name: MOBILE AI Agent Cloud Bridge

on:
  push:
    branches: [agent-queue]
    paths:
      - 'agent-queue/event-*.json'
      - 'agent-queue/commands/*.json'
  workflow_dispatch:
    inputs:
      task_file:
        description: Queue JSON file to inspect
        required: true
        default: agent-queue/health-check.json

permissions:
  contents: read

concurrency:
  group: mobile-ai-agent-cloud-bridge
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout task and project
        uses: actions/checkout@v4

      - name: Validate task and cloud project
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FILE: ${{ inputs.task_file }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            files=("$INPUT_FILE")
          else
            mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | awk 'index($0, "agent-queue/") == 1 && $0 ~ /[.]json$/ {print}')
          fi
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No task JSON files found in this event." | tee report.md
            exit 0
          fi
          {
            echo "# MOBILE AI Agent cloud report"
            echo
            echo "- Event: $EVENT_NAME"
            echo "- Commit: $CURRENT_SHA"
            echo "- Runner: ubuntu-latest"
            echo
          } > report.md
          for file in "${files[@]}"; do
            [[ -f "$file" ]] || { echo "Missing task file: $file"; exit 1; }
            python3 -m json.tool "$file" >/dev/null
            task_action="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("action",""))' "$file")"
            task_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("task_id",""))' "$file")"
            echo "## Task: $file" >> report.md
            echo "- Task ID: $task_id" >> report.md
            echo "- Action: $task_action" >> report.md
            case "$task_action" in
              repository_health_check)
                test -f settings.gradle.kts
                test -f app/build.gradle.kts
                test -f gradle/wrapper/gradle-wrapper.properties || test -f gradlew
                test -f app/src/main/java/com/mikhaildezprofi/mobileaiagent/ui/MainScreen.kt
                echo "- Result: repository structure check passed" >> report.md
                ;;
              collect_project_status|static_audit)
                [[ "$file" == agent-queue/commands/*.json ]] || { echo "Local-only action must be in commands/" >&2; exit 2; }
                echo "- Result: command schema accepted; Termux worker is responsible for local execution" >> report.md
                ;;
              *)
                echo "- Result: rejected; unsupported action" >> report.md
                exit 2
                ;;
            esac
            echo >> report.md
          done
          cat report.md

      - name: Upload execution report
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ai-agent-cloud-report
          path: report.md
          if-no-files-found: error
          retention-days: 7
